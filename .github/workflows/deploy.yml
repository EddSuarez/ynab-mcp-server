name: Build and deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read package version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/eddsuarez/ynab-mcp-server:latest
            docker.io/eddsuarez/ynab-mcp-server:${{ steps.version.outputs.version }}

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Deploy by digest through the Artifact Registry remote-repo proxy:
      # tag lookups can serve a stale cached manifest, digests cannot.
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ynab-mcp-server
          region: southamerica-west1
          project_id: hoobyt-212615
          image: southamerica-west1-docker.pkg.dev/hoobyt-212615/dockerhub/eddsuarez/ynab-mcp-server@${{ steps.build.outputs.digest }}

      # /healthz is swallowed by Google Frontend on run.app domains, so probe
      # /mcp instead: unauthenticated POST must return 401.
      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${{ steps.deploy.outputs.url }}/mcp" -d '{}')
          echo "POST /mcp without auth -> $code"
          test "$code" = "401"
